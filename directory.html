<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Services — LocalPro</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <a href="index.html" class="logo" aria-label="LocalPro Home"
          >LocalPro</a
        >
        <input
          type="checkbox"
          id="mobile-menu-toggle"
          class="mobile-menu-checkbox"
        />
        <label
          for="mobile-menu-toggle"
          class="mobile-menu-btn"
          aria-label="Toggle navigation menu"
        >
          <span class="hamburger-icon"></span>
        </label>
        <nav aria-label="Main Navigation" class="main-nav">
          <ul class="nav-list">
            <li>
              <a href="directory.html" aria-current="page">Find Services</a>
            </li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="#" class="btn btn-outline">Sign In</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main class="container directory-layout">
      <aside class="filters" aria-labelledby="filter-heading">
        <h2 id="filter-heading">Filters</h2>
        <form id="filter-form">
          <div class="form-group">
            <label for="filter-search">Keyword Search</label>
            <input
              type="text"
              id="filter-search"
              name="search"
              placeholder="e.g., wiring, cleaning"
            />
          </div>
          <div class="form-group">
            <label for="filter-category">Category</label>
            <select id="filter-category" name="category">
              <option value="">All Categories</option>
              <option value="plumbing">Plumbing</option>
              <option value="electrical">Electrical</option>
              <option value="cleaning">Cleaning</option>
              <option value="tutoring">Tutoring</option>
              <option value="moving">Moving</option>
              <option value="painting">Painting</option>
            </select>
          </div>
          <div class="form-group">
            <label for="filter-location">Location</label>
            <input
              type="text"
              id="filter-location"
              name="location"
              placeholder="e.g., Lagos"
            />
          </div>
          <div class="form-group">
            <label>Price Range (NGN)</label>
            <div class="price-range-inputs">
              <input
                type="number"
                id="filter-min-price"
                name="min_price"
                placeholder="Min"
                min="0"
                aria-label="Minimum price"
              />
              <input
                type="number"
                id="filter-max-price"
                name="max_price"
                placeholder="Max"
                min="0"
                aria-label="Maximum price"
              />
            </div>
          </div>
          <div class="form-group">
            <label for="filter-min-rating">Minimum Rating</label>
            <select id="filter-min-rating" name="min_rating">
              <option value="0">Any Rating</option>
              <option value="3">3+ Stars</option>
              <option value="4">4+ Stars</option>
              <option value="4.5">4.5+ Stars</option>
            </select>
          </div>
          <div class="form-group">
            <label>
              <input type="checkbox" name="verified_only" value="true" />
              Verified Providers Only
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            Apply Filters
          </button>
          <button
            type="button"
            id="clear-filters"
            class="btn btn-outline btn-block"
            style="margin-top: var(--space-sm)"
          >
            Clear All
          </button>
        </form>
      </aside>

      <section class="results" aria-labelledby="results-heading">
        <div class="results-header">
          <h2 id="results-heading">
            Search Results
            <span id="result-count" class="result-count">(Loading...)</span>
          </h2>
          <div class="sort-controls">
            <label for="sort-by">Sort by:</label>
            <select id="sort-by" name="sort">
              <option value="relevance">Relevance</option>
              <option value="rating_desc">Highest Rating</option>
              <option value="price_asc">Lowest Price</option>
            </select>
          </div>
        </div>

        <div id="provider-list" class="provider-grid">
          <!-- Dynamically populated by js/app.js -->
          <p class="loading-text">Loading providers...</p>
        </div>

        <nav class="pagination" aria-label="Pagination">
          <ul>
            <li>
              <a
                href="#"
                class="disabled"
                aria-label="Previous page"
                aria-disabled="true"
                >Previous</a
              >
            </li>
            <li><a href="#" aria-current="page">1</a></li>
            <li><a href="#">2</a></li>
            <li><a href="#">3</a></li>
            <li><a href="#" aria-label="Next page">Next</a></li>
          </ul>
        </nav>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2026 LocalPro. All rights reserved.</p>
      </div>
    </footer>

    <script src="js/data.js" defer></script>
    <script src="js/store.js" defer></script>
    <script src="js/components.js" defer></script>
    <script src="js/app.js" defer></script>
  </body>
</html>
